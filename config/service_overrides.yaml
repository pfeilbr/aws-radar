# Hand-curated edits applied on top of the AWS icon package by scripts/build_catalog.py.
#
# services: keyed by the id the builder derives from the icon name (slug of the name without
#   "Amazon"/"AWS"). Fields:
#   id        short, stable id used in URLs and file names
#   short     label for tiles
#   aliases   extra names that map here: What's New slugs, blog tags, botocore service names
#   keywords  case-sensitive regexes for spotting the service in free text (titles, posts).
#             Only add words that are unambiguous on their own ("DynamoDB", "EKS"), never
#             ordinary words ("Config", "Backup", "Connect"); those match via the full name.
#   parent    roll this service up under another in the UI
# drop: icon ids to skip.  extra: services with no icon in the package.

# Blog/feed taxonomy tags that are not services; kept out of data/reports/catalog-gaps.md.
ignore_tags: [post-types, learning-levels, artificial-intelligence, technical-how-to, advanced-300, compute,
              announcements, intermediate-200, security-identity-compliance, database, customer-solutions,
              storage, analytics, industries, best-practices, management-tools, uncategorized, public-sector,
              generative-ai, generative-ai-2, messaging, networking-content-delivery, thought-leadership,
              foundational-100, expert-400, news, partner-solutions, launch, aws-partner-network,
              application-integration, application-services, devops, programing-language, enterprise-strategy,
              entertainment, migration-enterprise-strategy, management-and-governance, financial-services,
              software, healthcare, migration-solutions, dot-net, government, security, internet-of-things,
              business-intelligence, open-source, migration, games, compliance, end-user-computing, how-to,
              aws-training-and-certification, sap, monitoring-and-observability, architecture, automotive,
              aws-global-infrastructure, robotics, experience-based-acceleration, ibm-redhat, serverless,
              quantum-technologies, manufacturing, retail, regions, mobile-services, aws-for-vmware,
              telecommunications, education, media-services, cloud-cost-optimization, game-development,
              security-governance, aiml]

drop: [marketplace-dark, express-workflows, workdocs-sdk, pinpoint-apis, elemental-appliances-and-software,
       thinkbox-frost, thinkbox-krakatoa, thinkbox-stoke, thinkbox-xmesh, elemental-delta,
       elemental-server, elemental-conductor, apache-mxnet-on-aws, backint-agent]

