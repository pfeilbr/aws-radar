# Lint, test and smoke-build on every code change. Data-only commits from the
# scheduled job skip this.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "**/*.md"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push supersedes this run

env:
  UV_LOCKED: "1"   # fail if uv.lock is out of date instead of resolving anew

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # read-only job: no token left in .git/config
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Build site data from data/raw
        run: uv run scripts/update.py --build-only
      - name: JavaScript syntax
        run: node --check site/app.js
