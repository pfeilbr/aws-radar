# Collect from every due source, rebuild digests, commit data/ back to main.
# Runs four times a day; the What's New feed only holds ~10 days, so never go below daily.
name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Poll every source, ignoring cadence"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write    # to start the pages workflow

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Configure git
        run: |
          git config user.name "aws-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: update
        name: Collect, build, commit
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: uv run scripts/update.py --commit --push ${{ inputs.force && '--force' || '' }}
      - name: Deploy site
        # A push made with GITHUB_TOKEN does not trigger other workflows, so call Pages here.
        if: steps.update.outputs.committed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
