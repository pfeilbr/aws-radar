<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS Radar</title>
  <meta name="description" content="Per-service digest of everything new in AWS: launches, blog posts, API changes, community and social, updated automatically.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="alternate" type="application/atom+xml" title="AWS Radar: launches and API changes" href="feeds/launches.xml">
  <meta property="og:title" content="AWS Radar">
  <meta property="og:description" content="Per-service digest of everything new in AWS: launches, API changes, roadmaps, blogs, community. Updated every 6 hours.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pfeilbr.github.io/aws-radar/">
  <meta name="theme-color" content="#232F3E">
  <script>
    try { const t = localStorage.getItem("radar-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="AWS Radar home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".6"/><path d="M16 16 L27 7" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="16" r="2.5" fill="var(--accent)"/></svg>
      <span>AWS Radar</span>
    </a>
    <div class="search">
      <input id="q" type="search" placeholder="Find a service or search updates  ( / )" autocomplete="off" spellcheck="false">
      <ul id="suggest" class="suggest" hidden></ul>
    </div>
    <div class="meta" id="meta"></div>
    <button id="theme" class="icon-btn" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
  </header>

  <main id="app" aria-live="polite"><p class="empty">Loading…</p></main>

  <footer class="foot">
    Built from public AWS and community sources by
    <a href="https://github.com/pfeilbr/aws-radar">aws-radar</a>. Not affiliated with AWS.
    Service icons © Amazon Web Services.
  </footer>

  <script src="data/index.js"></script>
  <script src="app.js"></script>
</body>
</html>
